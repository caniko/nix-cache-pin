# Generated by simit. Manual edits will be reported as ci=drift.
# coordinated workspace publish: prerequisites before dependents.
# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
name: Publish Workspace

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag and lockstep versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2; exit 1; fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          validated_sha="$(git rev-list -n 1 "$tag")"
          test "$validated_sha" = "${GITHUB_SHA:?missing workflow event SHA}" || { echo "Signed tag commit does not match the workflow event SHA; refusing a moved tag" >&2; exit 1; }
          git checkout --detach "$validated_sha"
          test "$(nix develop -c cargo pkgid -p nix-cache-pin-lib | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "nix-cache-pin-lib 0.1.2 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p cache-pin | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "cache-pin 0.1.2 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p hydra-query | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "hydra-query 0.1.2 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p narinfo-check | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "narinfo-check 0.1.2 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p nix-eval-store-path | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "nix-eval-store-path 0.1.2 does not match tag $tag" >&2; exit 1; }
  gate-harbor-ci:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Required gate harbor-ci
        run: nix develop -c harbor-ci full
  publish-nix-cache-pin-lib:
    needs: [gate-harbor-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
