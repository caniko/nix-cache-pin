# Generated by simit. Manual edits will be reported as ci=drift.
name: pages

'on':
  push:
    branches:
      - main

concurrency:
  group: ${{ codeberg.workflow }}-${{ codeberg.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate Pages domain
        run: |
          nix build .#site --no-link --out-link result-pages-site
          test -f result-pages-site/.domains
          grep -qx nix-cache-pin.tartanoglu.com result-pages-site/.domains
      - name: Deploy Codeberg Pages
        env:
          CODEBERG_TOKEN: ${{ secrets.codeberg_token }}
        run: |
          test -n "$CODEBERG_TOKEN"
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.codeberg.org"
          git remote add pages-origin "https://caniko:${CODEBERG_TOKEN}@codeberg.org/caniko/nix-cache-pin.git"
          DEPLOY_REMOTE=pages-origin nix run .#deploy-pages
