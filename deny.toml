[advisories]
version = 2
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  # Rustls/AWS-LC implementation and the platform verifier's root certificate data.
  "ISC",
  "CDLA-Permissive-2.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
