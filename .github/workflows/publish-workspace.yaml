# Generated by simit. Manual edits will be reported as ci=drift.
# Credential-free signed-tag build. Rerun the original signed-tag run for recovery.
name: Build Workspace Crates

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

      - name: Required gate harbor-ci
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: nix develop -c harbor-ci full
      - name: Test nix-cache-pin-lib
        run: nix develop -c cargo test --locked -p nix-cache-pin-lib --all-targets
      - name: Clippy nix-cache-pin-lib
        run: nix develop -c cargo clippy --locked -p nix-cache-pin-lib --all-targets -- -D warnings
      - name: Test cache-pin
        run: nix develop -c cargo test --locked -p cache-pin --all-targets
      - name: Clippy cache-pin
        run: nix develop -c cargo clippy --locked -p cache-pin --all-targets -- -D warnings
      - name: Test hydra-query
        run: nix develop -c cargo test --locked -p hydra-query --all-targets
      - name: Clippy hydra-query
        run: nix develop -c cargo clippy --locked -p hydra-query --all-targets -- -D warnings
      - name: Test narinfo-check
        run: nix develop -c cargo test --locked -p narinfo-check --all-targets
      - name: Clippy narinfo-check
        run: nix develop -c cargo clippy --locked -p narinfo-check --all-targets -- -D warnings
      - name: Test nix-eval-store-path
        run: nix develop -c cargo test --locked -p nix-eval-store-path --all-targets
      - name: Clippy nix-eval-store-path
        run: nix develop -c cargo clippy --locked -p nix-eval-store-path --all-targets -- -D warnings
      - name: Package coordinated release set
        run: nix develop -c cargo package --locked --allow-dirty --no-verify -p nix-cache-pin-lib -p cache-pin -p hydra-query -p narinfo-check -p nix-eval-store-path --target-dir "$RUNNER_TEMP/simit-package-target"
      - name: Build immutable archive nix-cache-pin-lib
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p nix-cache-pin-lib | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/nix-cache-pin-lib"
          cp "$RUNNER_TEMP/simit-package-target/package/nix-cache-pin-lib-$version.crate" "$RUNNER_TEMP/simit-crates/nix-cache-pin-lib/"
      - name: Retain original-run archive nix-cache-pin-lib
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-nix-cache-pin-lib-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/nix-cache-pin-lib/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive cache-pin
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p cache-pin | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/cache-pin"
          cp "$RUNNER_TEMP/simit-package-target/package/cache-pin-$version.crate" "$RUNNER_TEMP/simit-crates/cache-pin/"
      - name: Retain original-run archive cache-pin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-cache-pin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/cache-pin/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive hydra-query
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p hydra-query | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/hydra-query"
          cp "$RUNNER_TEMP/simit-package-target/package/hydra-query-$version.crate" "$RUNNER_TEMP/simit-crates/hydra-query/"
      - name: Retain original-run archive hydra-query
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-hydra-query-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/hydra-query/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive narinfo-check
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p narinfo-check | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/narinfo-check"
          cp "$RUNNER_TEMP/simit-package-target/package/narinfo-check-$version.crate" "$RUNNER_TEMP/simit-crates/narinfo-check/"
      - name: Retain original-run archive narinfo-check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-narinfo-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/narinfo-check/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive nix-eval-store-path
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p nix-eval-store-path | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/nix-eval-store-path"
          cp "$RUNNER_TEMP/simit-package-target/package/nix-eval-store-path-$version.crate" "$RUNNER_TEMP/simit-crates/nix-eval-store-path/"
      - name: Retain original-run archive nix-eval-store-path
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-nix-eval-store-path-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/nix-eval-store-path/*.crate
          if-no-files-found: error
          retention-days: 30
