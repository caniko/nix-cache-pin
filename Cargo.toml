[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.metadata.crane]
name = "nix-cache-pin"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
regex = "1"
semver = "1"
colored = "3"
indicatif = "0.17"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
