[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.metadata.crane]
name = "nix-cache-pin"

[workspace.metadata.harbor-ci]
test-runner = "nextest"
docs = true
audit = true
deny = true
package = true

[workspace.package]
version = "0.1.2"
repository = "https://github.com/caniko/nix-cache-pin"
homepage = "https://nix-cache-pin.tartanoglu.com"
readme = "README.md"
rust-version = "1.88"
keywords = ["nix", "flake", "cache", "hydra", "pin"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
regex = "1"
semver = "1"
colored = "3"
futures-util = "0.3"
indicatif = "0.17"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
