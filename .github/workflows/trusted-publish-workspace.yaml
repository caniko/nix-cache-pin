      - name: Admit signed source and provider-bound archive nix-eval-store-path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package nix-eval-store-path --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package nix-cache-pin-lib --reconstruct-package cache-pin --reconstruct-package hydra-query --reconstruct-package narinfo-check --reconstruct-package nix-eval-store-path --publisher-output "$RUNNER_TEMP/verified-nix-eval-store-path" > "$RUNNER_TEMP/verified-nix-eval-store-path.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents nix-eval-store-path
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
        run: nix develop -c cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-nix-eval-store-path/Cargo.toml"
      - name: Required gate harbor-ci
        timeout-minutes: 30
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
        run: nix develop -c harbor-ci full
  publish-nix-eval-store-path:
    needs: [verify-nix-eval-store-path]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: .simit-publisher-engine
        run: cargo build --release --locked
      - name: Upload independently verified archive nix-eval-store-path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: .simit-publisher-engine/target/release/simit release publisher --publisher-stage publish --repo "$GITHUB_REPOSITORY" --package nix-eval-store-path --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package nix-cache-pin-lib --reconstruct-package cache-pin --reconstruct-package hydra-query --reconstruct-package narinfo-check --reconstruct-package nix-eval-store-path
  publish-report:
    needs:
      - publish-nix-cache-pin-lib
      - publish-cache-pin
      - publish-hydra-query
      - publish-narinfo-check
      - publish-nix-eval-store-path
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Release result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          echo 'resume: rerun the original tag-push run; already-published crates with matching checksums exit 0 after exact registry resolution'
          echo 'see per-crate job statuses for the auditable result'
