[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.metadata.crane]
name = "nix-cache-pin"

[workspace.metadata.harbor-ci]
test-runner = "nextest"
docs = true
audit = true
deny = true
package = true

[workspace.package]
version = "0.2.3"
repository = "https://github.com/caniko/nix-cache-pin"
homepage = "https://nix-cache-pin.tartanoglu.com"
readme = "README.md"
rust-version = "1.88"
keywords = ["nix", "flake", "cache", "hydra", "pin"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "fs",
] }
# Keep HTTP clients and strict narinfo decoding on the same base64 generation.
reqwest = { version = "=0.13.5", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls",
  "query",
  "stream",
  "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
regex = "1"
semver = "1"
console = "0.16"
futures-util = "0.3"
indicatif = "0.18"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
pep440_rs = "0.7"
pep508_rs = "0.9"
sha2 = "0.10"
flate2 = "1"
