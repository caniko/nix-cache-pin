[package]
name = "cache-pin"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pin Nix flake inputs to revisions with full binary-cache coverage"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cache-pin"
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE-*", "README.md"]

[package.metadata.docs.rs]
all-features = true

# Declared explicitly so release tooling sees every binary the crate ships;
# cargo would auto-discover the same three targets.
[[bin]]
name = "cache-pin"
path = "src/main.rs"

[[bin]]
name = "cache-pin-source-pins"
path = "src/bin/cache-pin-source-pins.rs"

[[bin]]
name = "cache-pin-wheel-pins"
path = "src/bin/cache-pin-wheel-pins.rs"

[dependencies]
nix-cache-pin-lib = { path = "../nix-cache-pin-lib", version = "0.3.3" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
console = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/nix-cache-pin-{ version }-aarch64-apple-darwin.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/nix-cache-pin-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/nix-cache-pin-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/nix-cache-pin-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/nix-cache-pin-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
