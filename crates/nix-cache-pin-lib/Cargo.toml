[package]
name = "nix-cache-pin-lib"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pin Nix flake inputs to revisions with full binary-cache coverage"
repository = "https://github.com/caniko/nix-cache-pin"
documentation = "https://docs.rs/nix-cache-pin-lib"
homepage = "https://nix-cache-pin.tartanoglu.com"
readme = "../../README.md"
rust-version = "1.88"
keywords = ["nix", "flake", "cache", "hydra", "pin"]
categories = ["development-tools"]
include = [
  "src/**",
  "tests/**",
  "build.rs",
  "Cargo.toml",
  "LICENSE-*",
  "README.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.22"
nix = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
futures-util = { workspace = true }
httpdate = "1"
tempfile = "3"

[build-dependencies]
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
