[package]
name = "nix-cache-pin-lib"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pin Nix flake inputs to revisions with full binary-cache coverage"
repository = "https://github.com/caniko/nix-cache-pin"
documentation = "https://docs.rs/nix-cache-pin-lib"
homepage = "https://nix-cache-pin.tartanoglu.com"
readme = "../../README.md"
rust-version = "1.88"
keywords = ["nix", "flake", "cache", "hydra", "pin"]
categories = ["development-tools"]
exclude = [
  ".github",
  "nix",
  "tests",
  "website",
  "keys",
  ".crow",
  ".direnv",
  "result*",
]

[dependencies]
nix = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
