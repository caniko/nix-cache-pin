        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Package archive with verification
        run: nix develop -c cargo package -p nix-cache-pin-lib --allow-dirty

      - name: Registry dry-run
        run: nix develop -c cargo publish -p nix-cache-pin-lib --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          crate_name='nix-cache-pin-lib'
          version="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$version" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            version="${ref#refs/tags/}"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine release version from tag ref" >&2
            exit 1
          fi
          if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" = 0 ]; then apt=(apt-get); else apt=(sudo apt-get); fi
              "${apt[@]}" update
              "${apt[@]}" install -y --no-install-recommends curl ca-certificates jq
            else
              echo "curl and jq are required to check crates.io for existing versions" >&2
              exit 1
            fi
          fi
