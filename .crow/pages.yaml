# Generated by simit. Manual edits will be reported as ci=drift.
name: pages
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- branch: main
  event: push
steps:
- name: deploy-pages
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix build .#.#site --no-link
  - test -d result
  - nix run .#.#deploy-pages
  - test "$(cat result/.domains 2>/dev/null || true)" = 'nix-cache-pin.tartanoglu.com'
  environment:
    codeberg_token:
      from_secret: codeberg_token
