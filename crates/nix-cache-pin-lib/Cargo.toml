[package]
name = "nix-cache-pin-lib"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pin Nix flake inputs to revisions with full binary-cache coverage"
repository = "https://github.com/caniko/nix-cache-pin"
documentation = "https://docs.rs/nix-cache-pin-lib"
homepage = "https://nix-cache-pin.tartanoglu.com"
readme = "../../README.md"
rust-version = "1.88"
keywords = ["nix", "flake", "cache", "hydra", "pin"]
categories = ["development-tools"]
include = [
  "src/**",
  "tests/**",
  "build.rs",
  "Cargo.toml",
  "LICENSE-*",
  "README.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.23"
nix = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }
futures-util = { workspace = true }
httpdate = "1"
pep440_rs = { workspace = true }
pep508_rs = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tempfile = "3"

[build-dependencies]
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rcgen = "0.14"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
